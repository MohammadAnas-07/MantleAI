[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mantle-ai-backend"
version = "0.1.0"
description = "Mantle AI backend: a developer workspace for working with multiple LLMs."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1,<0.164",
    "uvicorn[standard]>=0.54.0,<0.55",
    "pydantic-settings>=2.16.3,<3",
    "sqlalchemy[asyncio]>=2.1.9,<3",
    "asyncpg>=0.32.0,<0.33",
    "alembic>=1.20.1,<2",
    "cryptography>=50.0.2,<51",
    "pgvector>=0.4.2,<0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0,<10",
    "pytest-asyncio>=1.5.0,<2",
    "httpx>=0.28.1,<0.29",
    "ruff>=0.17.5,<0.18",
]

# Only package the "app" folder (not tests/ or anything else).
[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["db: needs PostgreSQL (uses the mantle_test database; skipped when it is down)"]

asyncio_default_fixture_loop_scope = "function"