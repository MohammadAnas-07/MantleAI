name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mantle
          POSTGRES_PASSWORD: mantle
          POSTGRES_DB: mantle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mantle -d mantle_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Only mantle_test exists. The tests replace DATABASE_URL with TEST_DATABASE_URL and
      # migrate it themselves; the guard needs the two to name different databases.
      DATABASE_URL: postgresql+asyncpg://mantle:mantle@127.0.0.1:5432/mantle
      TEST_DATABASE_URL: postgresql+asyncpg://mantle:mantle@127.0.0.1:5432/mantle_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install from the lock file
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: Generate a throwaway master key
        run: |
          key=$(python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          echo "::add-mask::$key"
          echo "MASTER_ENCRYPTION_KEY=$key" >> "$GITHUB_ENV"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build

  landing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      # The build also scans the output for remote resources and unknown links.
      - run: npm run build

  api-types:
    # gen:api:check imports the backend app to export the OpenAPI schema, so it needs both.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: Check the generated API types
        working-directory: frontend
        run: |
          npm ci
          MANTLE_PYTHON="$(command -v python)" npm run gen:api:check
