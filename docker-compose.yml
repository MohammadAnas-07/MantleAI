services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mantle
      POSTGRES_PASSWORD: mantle
      POSTGRES_DB: mantle
    ports:
      # 127.0.0.1 = only this computer can connect. Host port 5433 avoids a PostgreSQL installed on Windows (5432).
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
